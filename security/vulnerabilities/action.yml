name: Vulnerabilities

inputs:
  type:
    description: Either repository or image.
    default: repository
  target:
    description: The path or the image reference to scan, depending on the type.
    default: "."

runs:
  using: composite
  steps:
    - uses: aquasecurity/trivy-action@v0.36.0
      env:
        # Development dependencies are what the pipelines install and run.
        TRIVY_INCLUDE_DEV_DEPS: "true"
      with:
        scan-type: ${{ inputs.type == 'image' && 'image' || 'fs' }}
        scan-ref: ${{ inputs.target }}
        # A repository is checked for vulnerable dependencies and misconfigured
        # definitions, such as Dockerfiles. Secrets in Git are the job of the
        # security/leaks action, whereas images can have them baked in at build
        # time.
        scanners: ${{ inputs.type == 'image' && 'vuln,secret' || 'vuln,misconfig' }}
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: 1
