name: Vulnerabilities

inputs:
  type:
    description: Either repository or image.
    default: repository
  target:
    description: The path or the image reference to scan, depending on the type.
    default: "."

runs:
  using: composite
  steps:
    - uses: aquasecurity/trivy-action@v0.36.0
      env:
        # To include development dependencies.
        TRIVY_INCLUDE_DEV_DEPS: "true"
        # To make the output more readable. The version is set in this
        # repository and hence is checked here as well, by Dependabot.
        TRIVY_QUIET: "true"
        TRIVY_SKIP_VERSION_CHECK: "true"
      with:
        scan-type: ${{ inputs.type == 'image' && 'image' || 'fs' }}
        scan-ref: ${{ inputs.target }}
        # A repository is checked for vulnerable dependencies and misconfigured
        # definitions, such as Dockerfiles, whereas an image is checked for
        # vulnerable dependencies and secrets baked in them as build time.
        scanners: ${{ inputs.type == 'image' && 'vuln,secret' || 'vuln,misconfig' }}
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: 1
