name: Commit

inputs:
  base:
    default: main
  head:
    default: ""
  path:
    default: "."
  token:
    description: >
      The token used for the GitHub API, that is, for creating the pull request.
      The push itself uses the credentials persisted by the checkout action. If
      the push should have the same identity, which is needed for workflows on
      the pull request to run without manual approval when the branch is
      force-pushed on a re-run, pass the token to actions/checkout as well.
    default: ${{ github.token }}
  gpg_private_key:
    default: ""
  gpg_passphrase:
    default: ""
  message:
    required: true
  push:
    default: true
  title:
    default: ""
  description:
    default: This pull request has been created automatically.
  draft:
    default: false
  reviewer:
    default: ""
  force:
    default: false

runs:
  using: composite
  steps:
    - if: inputs.gpg_private_key != ''
      uses: crazy-max/ghaction-import-gpg@v7
      with:
        gpg_private_key: ${{ inputs.gpg_private_key }}
        passphrase: ${{ inputs.gpg_passphrase }}
        git_user_signingkey: true
        git_commit_gpgsign: true
        workdir: ${{ inputs.path }}
    - shell: bash
      run: |
        if [[ "${{ inputs.force }}" != true ]]; then
          if git diff --cached --exit-code > /dev/null; then
            exit 0
          fi
        fi
        if [[ -z "${{ inputs.title }}" ]]; then
          title=$(echo "${{ inputs.message }}" | head -1)
        else
          title="${{ inputs.title }}"
        fi
        if [[ -z "${{ inputs.head }}" ]]; then
          head=ttf-$(
            echo -n "${title}" \
              | tr "[:upper:]" "[:lower:]" \
              | tr -cs "[:alnum:]" - \
              | sed "s/^-*//; s/-*$//"
          )
        else
          head="${{ inputs.head }}"
        fi
        git config user.name "The Type Founders"
        git config user.email admin@thetypefounders.com
        if [[ "$(git rev-parse --abbrev-ref HEAD)" != "${head}" ]]; then
          git checkout -b "${head}"
        fi
        git commit --allow-empty -m "${{ inputs.message }}"
        if [[ "${{ inputs.push }}" != true ]]; then
          exit 0
        fi
        git push --force --set-upstream origin "${head}"
        if [[ -f "${{ inputs.description }}" ]]; then
          description=(--body-file "${{ inputs.description }}")
        else
          description=(--body "${{ inputs.description }}")
        fi
        number=$(
          gh pr list \
            --base "${{ inputs.base }}" \
            --head "${head}" \
            --json number \
            --jq ".[].number"
        )
        if [[ -n "${number}" ]]; then
          gh pr edit "${number}" "${description[@]}"
          exit 0
        fi
        arguments=(
          --base "${{ inputs.base }}"
          --head "${head}"
          --title "${title}"
          "${description[@]}"
        )
        if [[ "${{ inputs.draft }}" == true ]]; then
          arguments+=(--draft)
        fi
        if [[ -n "${{ inputs.reviewer }}" ]]; then
          arguments+=(--reviewer "${{ inputs.reviewer }}")
        fi
        gh pr create "${arguments[@]}"
      working-directory: ${{ inputs.path }}
      env:
        GH_TOKEN: ${{ inputs.token }}
