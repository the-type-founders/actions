name: Checkout

inputs:
  repository:
    default: ${{ github.repository }}
  reference:
    default: ""
  token:
    default: ${{ github.token }}
  path:
    default: "."
  clean:
    default: true
  fetch-depth:
    default: 1
  exclude:
    default: ""
  include:
    default: "*"
  persist-credentials:
    default: true
  submodules:
    default: false

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.reference }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        clean: ${{ inputs.clean }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: ${{ inputs.persist-credentials }}
        submodules: ${{ inputs.submodules }}
    - id: context
      shell: bash
      run: |
        git lfs ls-files \
          --exclude "${{ inputs.exclude }}" \
          --include "${{ inputs.include }}" \
          --long | sort > .key
        # Caches created with different filters should not serve as fallbacks
        # for one another, so the filters are made part of the key prefix.
        prefix=v2-$(printf "%s|%s" "${{ inputs.include }}" "${{ inputs.exclude }}" | sha256sum | cut -d " " -f 1)-
        key=${prefix}$(cat .key | sha256sum | cut -d " " -f 1)
        echo "The key is ${key} based on $(cat .key | wc -l | xargs) files:"
        head .key
        echo ...
        echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
        echo "key=${key}" >> "${GITHUB_OUTPUT}"
        rm .key
      working-directory: ${{ inputs.path }}
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}/.git/lfs
        key: ${{ steps.context.outputs.key }}
        restore-keys: ${{ steps.context.outputs.prefix }}
    - shell: bash
      run: |
        git lfs pull \
          --exclude "${{ inputs.exclude }}" \
          --include "${{ inputs.include }}"
      working-directory: ${{ inputs.path }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.path }}/.git/lfs
        key: ${{ steps.context.outputs.key }}
