name: Security

on:
  workflow_call:

jobs:
  leaks:
    name: Leaks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: $/security/leaks

  # The permissions are left to the caller. Apart from contents: read, it might
  # grant pull-requests: write for the report to be posted as a comment.
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/security/vulnerabilities
