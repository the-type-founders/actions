name: Security Vulnerabilities

on:
  workflow_call:

jobs:
  # The permissions are left to the caller. Apart from contents: read, it might
  # grant pull-requests: write for the report to be posted as a comment.
  main:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/security/vulnerabilities
