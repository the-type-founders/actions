name: Merge

inputs:
  token:
    default: ${{ github.token }}
  gpg_private_key:
    default: ""
  gpg_passphrase:
    default: ""
  path:
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        fetch-depth: 0
    - if: inputs.gpg_private_key != ''
      uses: crazy-max/ghaction-import-gpg@v7
      with:
        gpg_private_key: ${{ inputs.gpg_private_key }}
        passphrase: ${{ inputs.gpg_passphrase }}
        git_user_signingkey: true
        git_commit_gpgsign: true
        workdir: ${{ inputs.path }}
    - shell: bash
      run: |
        gh api "repos/${GITHUB_REPOSITORY}/branches/${BASE}/protection/required_status_checks/contexts" \
          | jq -r ".[]" \
          | sort > expected.txt \
          || rm -f expected.txt
        if [[ -f expected.txt ]]; then
          echo Expected:
          cat expected.txt
          echo
        fi
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        GH_TOKEN: ${{ inputs.token }}
    - shell: bash
      run: |
        for attempt in {1..10}; do
          gh pr checks "${PULL_REQUEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --required \
            --json name,state \
            --jq '.[] | select(.state == "SUCCESS") | .name' \
            | sort > actual.txt \
            || rm -f actual.txt
          if [[ -f actual.txt ]]; then
            echo Actual:
            cat actual.txt
            echo
          fi
          if [[ -f expected.txt && -f actual.txt ]]; then
            if ! diff -q expected.txt actual.txt > /dev/null; then
              echo "Failed on attempt ${attempt}. Sleeping..."
              sleep 60
              continue
            fi
          fi
          break
        done
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
    - if: inputs.gpg_private_key != ''
      shell: bash
      run: |
        if git merge-base --is-ancestor \
          "${BASE}" \
          "origin/${HEAD}"; then
          git merge --ff-only "origin/${HEAD}"
          git push
        else
          git config user.name "The Type Founders"
          git config user.email admin@thetypefounders.com
          git checkout "${HEAD}"
          git rebase "${BASE}"
          git push --force
        fi
      working-directory: ${{ inputs.path }}
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        HEAD: ${{ github.event.pull_request.head.ref }}
    - if: inputs.gpg_private_key == ''
      shell: bash
      run: |
        git merge --ff-only "origin/${HEAD}"
        git push
      working-directory: ${{ inputs.path }}
      env:
        HEAD: ${{ github.event.pull_request.head.ref }}
