name: Docker

inputs:
  repository:
    default: ${{ github.repository }}
  actor:
    default: ${{ github.actor }}
  token:
    default: ${{ github.token }}
  arguments:
    required: false
  platforms:
    default: linux/amd64
  version:
    required: true

runs:
  using: composite
  steps:
    - id: context
      shell: bash
      run: |
        if ! [[ "${{ inputs.version }}" =~ ^[0-9]+ ]]; then
          echo "tags=ghcr.io/${{ inputs.repository }}:${{ inputs.version }}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        patch_version=${{ inputs.version }}
        minor_version=${patch_version%.*}
        major_version=${minor_version%.*}
        cat >> "${GITHUB_OUTPUT}" <<OUTER
        tags<<INNER
        ghcr.io/${{ inputs.repository }}:${major_version}
        ghcr.io/${{ inputs.repository }}:${minor_version}
        ghcr.io/${{ inputs.repository }}:${patch_version}
        ghcr.io/${{ inputs.repository }}:latest
        INNER
        OUTER
    - uses: docker/setup-buildx-action@v4
    - if: inputs.platforms != 'linux/amd64'
      uses: docker/setup-qemu-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.actor }}
        password: ${{ inputs.token }}
    # The image is built twice. The first build targets the runner's platform
    # only and loads the result into the daemon, so that it can be scanned
    # before anything reaches the registry. The second build is the push: it
    # replays the cached build for the requested platforms and exports to the
    # registry, which a plain push from the daemon could not do for several
    # platforms at once.
    - uses: docker/build-push-action@v7
      with:
        build-args: ${{ inputs.arguments }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        tags: ${{ steps.context.outputs.tags }}
        load: true
    - uses: $/security/vulnerabilities
      with:
        type: image
        target: ghcr.io/${{ inputs.repository }}:${{ inputs.version }}
    - uses: docker/build-push-action@v7
      with:
        build-args: ${{ inputs.arguments }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.context.outputs.tags }}
        push: true
